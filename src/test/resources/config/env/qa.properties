# QA points at the public Restful Booker sandbox.
# admin/password123 are the vendor's published demo credentials, not private secrets.
# Override any of these with -Dauth.password=... or AUTH_PASSWORD without changing source code.

api.baseUri=https://restful-booker.herokuapp.com
api.basePath=
http.connectTimeoutMs=15000
http.responseTimeoutMs=45000
auth.type=cookieToken
auth.username=admin
auth.password=password123
auth.tokenEndpoint=/auth
auth.tokenField=token

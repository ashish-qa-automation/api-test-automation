# Default settings. Environment files override these.
# JVM system properties (-Dapi.baseUri=...) and environment variables (API_BASE_URI) override both.
# Priority: system property → environment variable → config/env/{env}.properties → this file.

env=qa

api.baseUri=
api.basePath=

http.connectTimeoutMs=10000
http.responseTimeoutMs=30000
http.logRequests=true
http.logResponses=true

auth.type=none
auth.username=
auth.password=
auth.token=
auth.apiKeyHeader=X-Api-Key
auth.apiKey=

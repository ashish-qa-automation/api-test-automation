name: Regression

on:
  workflow_dispatch:
  schedule:
    # Weekly, not nightly. Restful Booker is a shared public sandbox.
    - cron: '15 6 * * 1'

permissions:
  contents: read

jobs:
  regression:
    name: Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Temurin 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run regression tests
        run: mvn -B clean test -Pregression

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-regression
          path: target/surefire-reports
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-regression
          path: target/allure-results
          retention-days: 14
          if-no-files-found: warn
